<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ders Paneli Girişi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --green: #1f5a45; --green-deep: #133a2d; --red: #c24642; --cream: #eceadf; --paper: #f8f6ef; --line: #dcd8c8; --muted: #5f6b63; --fg: #17261f;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--paper); font: 16px/1.5 var(--body); color: var(--fg); }
/* Tam ekran uygulama sayfası: üstte kulübün yeşil alanı, altta form. */
.login { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.login-top { background: radial-gradient(circle at 85% 0%, #2a7458, var(--green) 50%, var(--green-deep)); color: #fff;
  padding: calc(48px + env(safe-area-inset-top, 0px)) 24px 36px; display: grid; gap: 18px; border-radius: 0 0 28px 28px; }
.logo { width: 64px; height: 64px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.login-top b { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: .6px; line-height: 1; display: block; }
.login-top span { font-size: 14px; color: #cfe0d7; }
.login-body { padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; align-content: start; gap: 18px; }
h1 { font-family: var(--display); font-size: 34px; margin: 0; line-height: 1; color: var(--green); }
p { margin: 0; color: var(--muted); font-size: 15px; }
form { display: grid; gap: 16px; }
label { font-size: 14px; font-weight: 600; display: grid; gap: 6px; }
input { font: 17px var(--body); padding: 15px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; width: 100%; color: var(--fg); }
input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
button { font: 700 16px var(--body); padding: 16px; border-radius: 14px; border: 0; background: var(--red); color: #fff; cursor: pointer; margin-top: 4px; }
.back { font-size: 14px; color: var(--muted); text-align: center; margin-top: 8px; }
.err { font-size: 14px; color: #b3322a; background: rgba(194,54,44,.08); border-radius: 12px; padding: 10px 12px; }
/* Bilgisayarda iPhone çerçevesi içinde gösterilir; telefonda çerçeve yoktur, ekranın kendisi olur. */
.device, .device-screen, .device-scroll { display: contents; }
.ip-status, .ip-home, .ip-key { display: none; }
@media (min-width: 760px) and (min-height: 640px) {
  html, body { height: 100%; }
  body { margin: 0; padding: 24px; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(circle at 80% 0%, #2a7458, #1f5a45 45%, #133a2d); }
  .device { display: block; position: relative; width: 412px; height: 866px; zoom: var(--ip-zoom, 1); padding: 11px;
    border-radius: 68px; background: #0a0a0b;
    box-shadow: 0 0 0 2px #6f757b, 0 0 0 4px #2b2f33, 0 0 0 5px #8a9096, 0 50px 90px rgba(0, 0, 0, .5); }
  .ip-key { display: block; position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #5d6369, #8a9096); }
  .ip-key.action { left: -8px; top: 15%; height: 4%; }
  .ip-key.up { left: -8px; top: 23%; height: 8%; }
  .ip-key.down { left: -8px; top: 33%; height: 8%; }
  .ip-key.power { right: -8px; left: auto; top: 27%; height: 12%; }
  .device-screen { display: block; position: relative; height: 100%; overflow: hidden; border-radius: 57px; background: var(--ip-bg, #fff); transform: translateZ(0); }
  .device-scroll { display: block; height: 100%; overflow-y: auto; scrollbar-width: none; }
  .device-scroll::-webkit-scrollbar { display: none; }
  .ip-status { display: grid; grid-template-columns: 1fr 126px 1fr; align-items: center; position: absolute; z-index: 30; inset: 0 0 auto; height: 54px; padding: 0 28px 0 34px;
    font: 600 16px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ip-ink, #111); background: var(--ip-bar, transparent); }
  .ip-status .island { justify-self: center; width: 122px; height: 35px; border-radius: 20px; background: #000; margin-top: 2px; }
  .ip-status .icons { justify-self: end; display: flex; gap: 6px; align-items: center; }
  .ip-status svg { display: block; fill: currentColor; }
  .ip-home { display: block; position: absolute; z-index: 30; left: 50%; bottom: 8px; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: var(--ip-ink, #111); opacity: .85; }
}
@media (min-width: 760px) and (min-height: 640px) {
  :root { --ip-bg: var(--paper); --ip-ink: #fff; }
  .login { min-height: 100%; height: 100%; }
  .login-top { padding-top: 76px; }
  .ip-home { background: var(--fg); }
}
</style>
</head>
<body>
<div class="device"><span class="ip-key action"></span><span class="ip-key up"></span><span class="ip-key down"></span><span class="ip-key power"></span>
<div class="device-screen"><div class="ip-status" aria-hidden="true"><span>14:00</span><span class="island"></span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.4 0-.8.2-1.1.4L8 11l1.1-1.3c-.3-.2-.7-.4-1.1-.4Z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".5"/></svg></span></div><span class="ip-home" aria-hidden="true"></span><div class="device-scroll">
<main class="login">
  <header class="login-top">
    <span class="logo" id="logo"></span>
    <div><b>PRIME TENİS</b><span>Ders Paneli</span></div>
  </header>
  <div class="login-body">
    <h1>Giriş yap</h1>
    <p>Kulübün size verdiği kullanıcı adı ve şifreyle girin.</p>
    <form id="login" novalidate>
      <label for="user">Kullanıcı adı<input id="user" autocomplete="username" autocapitalize="none"></label>
      <label for="pass">Şifre<input id="pass" type="password" autocomplete="current-password" placeholder="••••••"></label>
      <div id="err" class="err" hidden>Kullanıcı adı ya da şifre hatalı.</div>
      <button type="submit">Giriş yap</button>
    </form>
    <a class="back" href="index.html">← Prime Tenis sitesine dön</a>
  </div>
</main>
</div></div></div>
<script>
const logo = new Image();
logo.onload = () => document.getElementById('logo').appendChild(logo);
logo.src = 'gorseller/logo.jpg';
const roles = { ogrenci: 'ogrenci', 'öğrenci': 'ogrenci', hoca: 'hoca', yonetici: 'yonetici', 'yönetici': 'yonetici' };
document.getElementById('login').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('user').value.trim().toLocaleLowerCase('tr');
  const p = document.getElementById('pass').value;
  if (roles[u] && p === '123456') location.href = 'ders-paneli.html?rol=' + roles[u];
  else document.getElementById('err').hidden = false;
});
</script>
<script>
// iPhone çerçevesini pencereye sığdır (ekran hep 390 px genişliğinde çizilir).
const ipFit = () => document.documentElement.style.setProperty('--ip-zoom', Math.min(1, (innerHeight - 64) / 866, (innerWidth - 48) / 430).toFixed(3));
ipFit(); addEventListener('resize', ipFit);
</script>
</body>
</html>

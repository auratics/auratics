# GitHub Pages builds this site with its default Jekyll settings; this file
# only adds the sitemap for Google (auratics.app/sitemap.xml). New pages are
# listed by themselves. Pages that are not for search go in `defaults` below.
url: https://auratics.app
plugins:
  - jekyll-sitemap

# App link files live under .well-known, which Jekyll skips by default.
include:
  - .well-known

defaults:
  # KortPro's old legal addresses, now redirects to kortpro.app.
  - scope: { path: "kortpro" }
    values: { sitemap: false }
  # Not public yet.
  - scope: { path: "sablegelato" }
    values: { sitemap: false }
  # Apps not announced yet (2026-11-15): their pages stay up for the stores.
  - scope: { path: "habuddy" }
    values: { sitemap: false }
  - scope: { path: "sugar-free-streak" }
    values: { sitemap: false }
  - scope: { path: "portfoy-takip" }
    values: { sitemap: false }
  # Account deletion forms: there for the stores, not for search.
  - scope: { path: "delete-data.md" }
    values: { sitemap: false }
  - scope: { path: "fasting-tracker/delete-data.md" }
    values: { sitemap: false }
  - scope: { path: "maas-metre/delete-account.md" }
    values: { sitemap: false }

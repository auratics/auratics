<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're invited to Habuddy</title>
<meta name="description" content="Do your habits together. Open your invite in Habuddy.">
<link rel="icon" href="../assets/favicon.png?v=2">
<style>
  @font-face { font-family: "Jakarta"; src: url(../assets/home/fonts/PlusJakartaSans_500Medium.ttf) format("truetype"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Jakarta"; src: url(../assets/home/fonts/PlusJakartaSans_700Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Jakarta"; src: url(../assets/home/fonts/PlusJakartaSans_800ExtraBold.ttf) format("truetype"); font-weight: 800; font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #C3D1DC;
    font-family: "Jakarta", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(700px 500px at 80% 0%, rgba(120,170,210,.2), transparent 70%), radial-gradient(600px 500px at 0% 100%, rgba(70,120,170,.16), transparent 70%), #0E1820; }
  main { width: min(100%, 420px); padding: 40px 20px; text-align: center; }
  .icon { width: 88px; height: 88px; border-radius: 21px; margin: 0 auto 28px; display: block; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .kicker { margin: 0 0 12px; font-size: 12.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #A8CCE6; }
  h1 { margin: 0 0 12px; font-size: 36px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; color: #F2F6FA; }
  h1 em { font-style: normal; color: #A8CCE6; }
  p { margin: 0 0 26px; font-size: 16.5px; line-height: 1.55; }
  a.button { display: block; margin-top: 10px; padding: 17px; border-radius: 18px; background: #E6EFF6; color: #0E1820; font-size: 16.5px; font-weight: 700; text-decoration: none; }
  a.secondary { background: rgba(255,255,255,.05); color: #F2F6FA; border: 1px solid rgba(255,255,255,.12); }
  a.secondary:hover { border-color: #A8CCE6; }
  .hint { font-size: 14px; margin: 22px 0 0; color: #9DB0C1; }
  [hidden] { display: none !important; }
</style>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4456f492a72d49e4a4ff403dd1aab6a4"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<main>
  <img class="icon" src="../assets/icon-192.png?v=2" alt="Habuddy">
  <p class="kicker">You're invited</p>
  <h1>Habits stick better <em>together.</em></h1>
  <p>Someone wants to do a habit with you on Habuddy. Check in with a photo, see each other's week, keep the streak alive.</p>
  <a class="button" id="open" href="habuddy://" hidden>Open in Habuddy</a>
  <a class="button secondary" id="appstore" href="https://apps.apple.com/app/id6800276408">Get it on the App Store</a>
  <a class="button secondary" id="play" href="https://play.google.com/store/apps/details?id=com.auratics.habitual">Get it on Google Play</a>
  <p class="hint" id="after" hidden>Just installed it? Come back to this link and tap Open in Habuddy.</p>
</main>
<script>
  // Only ever a well-formed code goes anywhere: the page takes it from the address.
  var code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var appStore = document.getElementById('appstore');
  var play = document.getElementById('play');

  // Each phone sees its own store only; a computer sees both.
  if (ios) play.hidden = true;
  if (android) appStore.hidden = true;

  if (/^[A-Z2-9]{8}$/.test(code)) {
    var open = document.getElementById('open');
    var scheme = 'habuddy://invite/' + code;
    open.hidden = false;
    document.getElementById('after').hidden = false;

    if (android) {
      // Chrome and Samsung Internet open the app when it is there and go
      // straight to Google Play when it is not, with no error in between.
      var intent = 'intent://invite/' + code +
        '#Intent;scheme=habuddy;package=com.auratics.habitual;S.browser_fallback_url=' +
        encodeURIComponent(play.href) + ';end';
      open.href = intent;
      location.href = intent;
    } else {
      open.href = scheme;
      // Not tried on its own as the page opens: without the app, the browser
      // shows an error before anyone has tapped anything. On a tap, a page
      // still in front after a moment means the app is not there, so the
      // App Store takes over.
      open.addEventListener('click', function (event) {
        event.preventDefault();
        var left = false;
        var away = function () { left = true; };
        document.addEventListener('visibilitychange', away, { once: true });
        window.addEventListener('pagehide', away, { once: true });
        location.href = scheme;
        setTimeout(function () {
          if (!left && !document.hidden && ios) location.href = appStore.href;
        }, 1500);
      });
    }
  }
</script>
</body>
</html>
